name: check

on:
  push:
  pull_request:

jobs:
  report-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check server.mjs
      - run: node scripts/check-report-body.mjs
      - run: node scripts/check-handshake.mjs
